# Experimental VISION checkpoint. Same text backbone as the sibling
# deepseek-ai--DeepSeek-V4-Flash-0731.toml (284B total / 13B active,
# DeepseekV4ForCausalLM, native fp8 e4m3 + ue8m0 block scales, 43 layers,
# hidden 4096, num_key_value_heads 1, 1M context) plus a dense ViT + Aligner
# vision tower (~466M params, bf16, NOT quantized) and a second MoE routing
# bias (`bias_vl`) used for image tokens.
#
# config.json deltas vs -0731, diffed key-by-key against both files (the ONLY
# differences):
#   + vision_dim=1024, vision_inter_dim=2816, vision_n_heads=16,
#     vision_n_layers=32, vision_patch_size=14, vision_downsample_ratio=3,
#     vision_max_n_token=384, vision_min_pixels=147456, vision_max_wh_ratio=8,
#     vision_rope_theta=10000.0   (all TOP-LEVEL -- there is NO `vision_config`
#     sub-dict, and no `image_token_id`, which is why exo cannot autodetect
#     vision for this model and the [vision] block below is explicit)
#   ~ num_nextn_predict_layers 1 -> 3
#   ~ rms_norm_eps 1e-06 -> 1e-20
#   ~ transformers_version 4.57.1 -> 5.0.0
#
# storage_size = model.safetensors.index.json `metadata.total_size`, read from
# the actual downloaded checkpoint on the cluster node (NOT the HF API page
# figure, and NOT copied from a doc): 167,811,372,792 bytes. Cross-check: the
# sibling -0731 index in the same tree reports 166,878,536,440, matching that
# card. As with -0731 this includes on-disk mtp.*/dspark tensors, so true
# loaded RAM after any strip-if-unused gate is somewhat lower -- storage_size
# is a conservative placement estimate, not an exact loaded footprint.
#
# NOT VERIFIED END-TO-END ON HARDWARE. The vision port's Phase 1 (ViT +
# Aligner MLX port) reached fp32 parity vs the DeepSeek torch reference (ViT
# max abs 4.29e-06, Aligner max abs 3.04e-06) and Phase 2 (image processor)
# reproduces reference token ids exactly, but no full-cluster inference run
# against this checkpoint has happened yet. TREAT AS UNVERIFIED.
model_id = "deepseek-ai/DeepSeek-V4-Flash-Vision-Exp"
n_layers = 43
hidden_size = 4096
num_key_value_heads = 1
supports_tensor = true
tasks = ["TextGeneration"]
family = "deepseek"
quantization = "fp8"
base_model = "DeepSeek V4 Flash Vision Exp"
capabilities = ["text", "thinking", "thinking_toggle", "vision"]
reasoning_dialect = "tool_conditional"

context_length = 1048576
backends = ["MlxMetal", "MlxCuda", "MlxCpu"]
[storage_size]
in_bytes = 167811372792

# DSv4's vision scheme does not match the mlx-vlm-shaped default, so this
# block is explicit (`detect_vision_from_config` keys off `vision_config` +
# `image_token_id`, neither of which this checkpoint has).
#
# `scheme = "deepseek_v4"` routes VisionProcessor to the DSv4-native path:
# in-tree image processor, `vision.`/`aligner.` weights loaded from the main
# model repo, and image tokens emitted as SENTINEL TYPES offset past the
# vocabulary (`vocab_size + {0..4}`) rather than one repeated placeholder id.
#
# `image_token_id = 129280` is `vocab_size + IMAGE_START`, i.e. the first
# sentinel and the id that marks the start of an image span. It is NOT a
# lookup index -- it is deliberately OUT OF RANGE of the 129280-row embedding
# table, because the real embeddings are merged in, not looked up.
#
# `placeholder_token` is the encoder's IMAGE_PLACEHOLDER, the marker that
# `expand_image_placeholders` replaces with a full sentinel block.
[vision]
scheme = "deepseek_v4"
model_type = "deepseek_v4"
image_token_id = 129280
placeholder_token = "<｜deepseek_image｜>"

# UNVERIFIED FOR THIS CHECKPOINT. These are carried over verbatim from the
# -0731 card purely so the model is launchable; they have NOT been A/B'd
# against Vision-Exp's own weights, and the eval that originally produced them
# (the preview checkpoint's hard_eval: Ollama 100% vs exo 78.8% at DeepSeek's
# official temp=1.0 recommendation) was run on a DIFFERENT checkpoint on a
# text-only workload. This checkpoint's own README recommends temperature=1.0
# with top_p=0.95 for agentic use (top_p=1.0 otherwise). Re-run an A/B before
# trusting these, especially for image prompts, which nothing here covers.
[sampling_defaults]
temperature = 0.8
top_p = 0.9
top_k = 40
min_p = 0.0
