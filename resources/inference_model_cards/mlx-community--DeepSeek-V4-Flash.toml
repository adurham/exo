model_id = "mlx-community/DeepSeek-V4-Flash"
n_layers = 43
hidden_size = 4096
num_key_value_heads = 1
supports_tensor = true
tasks = ["TextGeneration"]
family = "deepseek"
quantization = "8bit"
base_model = "DeepSeek V4 Flash"
capabilities = ["text", "thinking", "thinking_toggle"]
reasoning_dialect = "tool_conditional"

context_length = 1048576
backends = ["MlxMetal", "MlxCuda", "MlxCpu"]
[storage_size]
in_bytes = 155095760030

# Sampling parity with Ollama Cloud (2026-07-27). History: this card previously
# ran DeepSeek's official rec (temp=1.0) with top_p 0.95 + min_p 0.05 bolted on
# after DSv4 kept corrupting long structured tool-call bodies (bare
# </parameter></invoke> closers mid-write_file, stray-quote dissolution — see
# 283a0fed / 4b4309d5). A hermes-driven hard_eval A/B on the SAME weights
# (2026-07-26, deepseek-v4-flash:cloud FP8 vs this 8bit card) scored Ollama
# 100% (66/66, coding 15/15) vs exo 78.8% (coding 3/15): exo's failures were
# exactly the two shapes this card's guardrails were fighting — mid-tool-call
# closing-tag corruption, plus a first-token style flip (agentic file-write
# instead of the inline answer Ollama gives 12/15 in one call). Ollama's
# Modelfile for this model sets NO parameters (confirmed via /api/show), so it
# serves at Ollama's runtime defaults: temp 0.8, top_p 0.9, top_k 40, min_p 0.
# That materially tighter sampler is where the quality gap lives. Match it
# exactly so the same weights behave the same and latency is the only
# difference. min_p is pinned to 0.0 (not omitted) because an absent card value
# falls through to exo's hardcoded min_p 0.05 — top_k 40 already clips the tail
# far harder than that floor did.
[sampling_defaults]
temperature = 0.8
top_p = 0.9
top_k = 40
min_p = 0.0
