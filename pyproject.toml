[project]
name = "exo"
version = "0.3.70"
description = "Exo"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
  "aiofiles>=24.1.0",
  "aiohttp>=3.12.14",
  "types-aiofiles>=24.1.0.20250708",
  "pydantic>=2.11.7",
  "fastapi>=0.116.1",
  "filelock>=3.18.0",
  "rustworkx>=0.17.1",
  "huggingface-hub>=1.8.0",
  "psutil>=7.0.0",
  "loguru>=0.7.3",
  "exo-rs",                          # rust bindings
  "anyio==4.11.0",
  "tiktoken>=0.12.0",                # required for kimi k2 tokenizer
  "hypercorn>=0.18.0",
  "openai-harmony>=0.0.8",
  "httpx>=0.28.1",
  "tomlkit>=0.14.0",
  "python-multipart>=0.0.21",
  "msgspec>=0.19.0",
  "zstandard>=0.23.0",
  "transformers>=5.6.2",
  "python-daemon>=3.1.2",
  "prometheus-client>=0.22.1",
]

[project.scripts]
exo = "exo.main:main"

# dependencies only required for development
[dependency-groups]
dev = [
  "basedpyright>=1.29.0",
  "pyinstaller>=6.17.0",
  "playwright>=1.52.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "pytest-env",
  "ruff>=0.11.13",
]

[project.optional-dependencies]
build = ["nanobind"]
mlx-none = ["anyio"]
mlx = [
  "mlx==0.32.0",
  "mlx-lm",
  "mlx-vlm>=0.3.11",
  "mflux==0.17.5",
  "torch==2.10.0; sys_platform == 'darwin'",
  "torch==2.10.0; sys_platform == 'linux'",
  "torchaudio==2.10.0; sys_platform == 'darwin'",
  "torchaudio==2.10.0; sys_platform == 'linux'",
  "torchvision==0.25.0; sys_platform == 'darwin'",
  "torchvision==0.25.0; sys_platform == 'linux'",
]
mlx-cpu = ["exo[mlx]", "mlx-cpu==0.31.2; sys_platform == 'linux'"]
mlx-cuda12 = [
  "exo[mlx]",
  "mlx-cuda-12==0.32.0; sys_platform == 'linux'",
  "nvidia-ml-py>=13.595.45",
]
mlx-cuda13 = [
  "exo[mlx]",
  "mlx-cuda-13==0.32.0; sys_platform == 'linux'",
  "nvidia-ml-py>=13.595.45",
]

###
# workspace configuration
###

[tool.uv.workspace]
members = ["rust/exo_rs", "bench", "tools"]

[tool.uv.sources]
exo-rs = { workspace = true }
mlx = [
  # darwin: our fork's main (upstream-refactored lib/jaccl layout + adurham perf
  # work + ack-qp-isolated barrier). main == former wip/try-ack-qp-isolated-ported
  # (same SHA as of 2026-05-29); pin tracks main now so future fork work flows in
  # via `git push adurham main`. To switch back to Leo's fork, replace with:
  # { git = "https://github.com/rltakashige/mlx-jaccl-fix-small-recv.git", branch = "address-rdma-gpu-locks", marker = "sys_platform == 'darwin'" }
  { git = "https://github.com/adurham/mlx.git", branch = "main", marker = "sys_platform == 'darwin'" },
  { url = "https://github.com/rltakashige/mlx-jaccl-fix-small-recv/releases/download/mlx_cuda/mlx-0.32.0-cp313-cp313-manylinux_2_35_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
  { url = "https://github.com/rltakashige/mlx-jaccl-fix-small-recv/releases/download/mlx_cuda/mlx-0.32.0-cp313-cp313-manylinux_2_35_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine != 'aarch64'" },
]
mlx-cuda-12 = [
  { url = "https://github.com/rltakashige/mlx-jaccl-fix-small-recv/releases/download/mlx_cuda/mlx_cuda_12-0.32.0-py3-none-manylinux_2_35_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
  { url = "https://github.com/rltakashige/mlx-jaccl-fix-small-recv/releases/download/mlx_cuda/mlx_cuda_12-0.32.0-py3-none-manylinux_2_35_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine != 'aarch64'" },
]
mlx-cuda-13 = [
  { url = "https://github.com/rltakashige/mlx-jaccl-fix-small-recv/releases/download/mlx_cuda/mlx_cuda_13-0.32.0-py3-none-manylinux_2_35_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
  { url = "https://github.com/rltakashige/mlx-jaccl-fix-small-recv/releases/download/mlx_cuda/mlx_cuda_13-0.32.0-py3-none-manylinux_2_35_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine != 'aarch64'" },
]
# mlx-lm: our fork's main (= former eagle-soft-emb perf work + upstream sync,
# incl. Gemma 4 KV-projection fix). Pin tracks main now. To switch back to Leo's
# fork: { git = "https://github.com/rltakashige/mlx-lm", branch = "leo/deepseek-v4" }
mlx-lm = { git = "https://github.com/adurham/mlx-lm.git", branch = "main" }
mflux = { git = "https://github.com/evanev7/mflux", branch = "exo2" }
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' and extra == 'mlx-cpu' and extra != 'mlx-cuda13' and extra != 'mlx-cuda12'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' and extra == 'mlx-cuda12' and extra != 'mlx-cuda13' " },
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' and extra == 'mlx-cuda13'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' and extra == 'mlx-cpu' and extra != 'mlx-cuda13' and extra != 'mlx-cuda12'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' and extra == 'mlx-cuda12' and extra != 'mlx-cuda13'" },
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' and extra == 'mlx-cuda13'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' and extra == 'mlx-cpu' and extra != 'mlx-cuda13' and extra != 'mlx-cuda12'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' and extra == 'mlx-cuda12' and extra != 'mlx-cuda13'" },
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' and extra == 'mlx-cuda13'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

###
# type-checker configuration
###

[tool.basedpyright]
include = ["src", "bench", "tools"]
typeCheckingMode = "strict"
failOnWarnings = true

reportAny = "error"
reportUnknownVariableType = "error"
reportUnknownParameterType = "error"
reportMissingParameterType = "error"
reportMissingTypeStubs = "error"
reportInvalidCast = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryTypeIgnoreComment = "error"

pythonVersion = "3.13"
pythonPlatform = "Darwin"

exclude = [
  "**/.venv",
  "**/venv",
  "**/__pycache__",
  "**/exo_scripts",
  "**/.direnv",
  "**/rust",
  "**/.github",
]
stubPath = ".typings"

[[tool.basedpyright.executionEnvironments]]
root = "src/exo/worker/engines/image"
reportMissingModuleSource = false

[[tool.basedpyright.executionEnvironments]]
root = "src"

[[tool.basedpyright.executionEnvironments]]
root = "bench"
extraPaths = ["tools/src"]

[[tool.basedpyright.executionEnvironments]]
root = "tools/src"


###
# uv configuration
###

# supported platforms for this project
[tool.uv]
required-version = ">=0.8.6"
prerelease = "allow"
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
override-dependencies = ["opencv-python; python_version < '0'"]
conflicts = [
  [
    { extra = "mlx-cuda13" },
    { extra = "mlx-cuda12" },
    { extra = "mlx-cpu" },
    { extra = "mlx-none" },
  ],
]

[tool.uv.extra-build-dependencies]
miniaudio = ["setuptools", "cffi", "pycparser"]
mlx = [
  "setuptools",
  "typing-extensions",
  "nanobind",
  "pybind11",
  "wheel",
  "cmake",
  "ninja",
]
mlx-lm = ["setuptools"]
mflux = ["uv_build"]
xgrammar = [
  "nanobind",
  "setuptools",
  "scikit-build-core",
  "packaging",
  "pathspec",
]
rouge-score = ["setuptools"]
sacrebleu = ["setuptools"]
sqlitedict = ["setuptools"]
word2number = ["setuptools"]
vllm = [
  "setuptools",
  "setuptools-scm",
  "scikit-build-core",
  "jinja2",
  "wheel",
  "markupsafe",
  "typing-extensions",
  "torch",
]
fastsafetensors = ["setuptools", "pybind11"]
torch = ["typing-extensions"]
torchvision = ["torch"]
torchaudio = ["torch"]

###
# ruff configuration
###

[tool.ruff]
# The CI lint derivation (python/parts.nix `checks.lint`) runs
# `ruff check ${inputs.self}` — a traversal of the WHOLE flake source tree, not
# just our packages. Scope it to code we actually own and maintain.
extend-exclude = [
  ".typings/**",
  "rust/exo_rs/**",
  # Vendored third-party benchmark harness code — not ours to restyle.
  "bench/vendor/**",
  # Vendored upstream dependencies, checked out as git submodules. These are
  # NOT what was inflating the CI lint count: they are gitlinks (mode 160000)
  # with zero tracked files, and CI's actions/checkout@v4 has no `submodules:`
  # key, so CI never populates them. They ARE populated in a normal local
  # checkout though, so excluding them keeps `uv run ruff check` usable locally
  # and keeps the lint correctly scoped if submodule checkout is ever enabled.
  "mlx/**",
  "mlx-lm/**",
  # One-off performance/diagnostic probe scripts. Not shipped, not imported by
  # `src/`, and already excluded from the pytest run (`--ignore=tmp` below).
  "bench/**",
  "tmp/**",
]

[tool.ruff.lint]
extend-select = ["I", "N", "B", "A", "PIE", "SIM"]

[tool.ruff.lint.isort]
# Pin the first-party/third-party split so import ORDER does not depend on
# whether the vendored submodules happen to be checked out.
#
# `mlx` is a third-party dependency, but a local dev checkout also has an
# `mlx/` submodule directory at the repo root. Ruff's isort infers first-party
# packages from the filesystem, so it classified `mlx` as FIRST-party locally
# (submodule present) and THIRD-party in CI (actions/checkout@v4 does not fetch
# submodules). That made a correctly-sorted file locally fail `checks.lint` in
# CI and vice versa -- lint results that changed with checkout state.
# Declaring these explicitly makes the classification deterministic everywhere.
known-third-party = ["mlx", "mlx_lm", "mlx_vlm", "mflux"]

[tool.ruff.lint.per-file-ignores]
# Hand-written MLX/Metal GPU kernel shims. These use single-capital and
# capitalized-compound identifiers (B, M, N, K, S_pre, H_q, H_kv, K_groups,
# N_QKV) as tensor/matrix DIMENSION names, matching (a) the accompanying
# hand-written .metal kernel source, (b) mlx upstream's own kernel-binding
# naming, and (c) standard GEMM/attention notation. Lowercasing them would
# break the one-to-one correspondence with the kernel code these shims bind
# to, which is the primary thing that makes them reviewable. This is a
# naming-convention exemption ONLY (N803 argument names / N806 local
# variables); every other rule still applies to these files.
"src/exo/worker/engines/mlx/patches/**" = ["N803", "N806"]
"src/exo/worker/engines/mlx/speculative/**" = ["N803", "N806"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
markers = ["slow: marks tests as slow (deselected by default)"]
env = ["EXO_TESTS=1"]
addopts = "-m 'not slow' --ignore=tests --ignore=tmp"
filterwarnings = ["ignore:builtin type Swig:DeprecationWarning"]
